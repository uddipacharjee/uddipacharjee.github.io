<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428" width="640" height="428" role="img" aria-labelledby="title desc">
  <title id="title">How two Eclipse Dataspace Components connectors share data</title>
  <desc id="desc">A Spring Boot onboarding service publishes an offer through the provider connector's Management API: an asset, a policy and a contract definition. The consumer's control plane then talks to the provider's over the Dataspace Protocol: it requests the catalog, negotiates a contract and starts a transfer process. The control planes signal their data planes, and the data itself moves between the data planes. Management APIs stay private; connectors only talk to each other over the Dataspace Protocol.</desc>
  <style>
    .bg { fill: #f6f7f9; }
    .t { fill: #161b22; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s { fill: #566070; font: 400 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .n { fill: #3d6a8a; font: 600 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .app { fill: #ffffff; stroke: #c3cfda; stroke-width: 1.5; }
    .cp { fill: #e6ebf0; stroke: #9fb5c7; stroke-width: 1.5; }
    .dp { fill: #d5e0e7; stroke: #9fb5c7; stroke-width: 1.5; }
    .line { stroke: #566070; stroke-width: 1.5; fill: none; }
    .dsp { stroke: #3d6a8a; stroke-width: 2; fill: none; }
    .sig { stroke: #566070; stroke-width: 1.25; fill: none; stroke-dasharray: 4 4; }
    .head { fill: #566070; }
    .head-a { fill: #3d6a8a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #11151b; }
      .t { fill: #e7eaef; }
      .s { fill: #a4adba; }
      .n { fill: #9cc1dc; }
      .app { fill: #171c23; stroke: #33404c; }
      .cp { fill: #1c252e; stroke: #3d5568; }
      .dp { fill: #283743; stroke: #3d5568; }
      .line, .sig { stroke: #a4adba; }
      .dsp { stroke: #9cc1dc; }
      .head { fill: #a4adba; }
      .head-a { fill: #9cc1dc; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-a"/></marker>
  </defs>

  <rect class="bg" width="640" height="428"/>
  <text class="t" x="16" y="24">Provider</text>
  <text class="t" x="624" y="24" text-anchor="end">Consumer</text>

  <!-- Row A: applications -->
  <rect class="app" x="16" y="36" width="220" height="56" rx="8"/>
  <text class="t" x="30" y="60">Onboarding service</text>
  <text class="s" x="30" y="79">Spring Boot</text>
  <rect class="app" x="404" y="36" width="220" height="56" rx="8"/>
  <text class="t" x="418" y="60">Consumer application</text>
  <text class="s" x="418" y="79">uses its own connector</text>

  <line class="line" x1="126" y1="92" x2="126" y2="124" marker-end="url(#a)"/>
  <text class="n" x="136" y="113">1 publish offer</text>
  <line class="line" x1="514" y1="92" x2="514" y2="124" marker-end="url(#a)"/>

  <!-- Row B: control planes -->
  <rect class="cp" x="16" y="128" width="220" height="104" rx="8"/>
  <text class="t" x="30" y="152">Control plane</text>
  <text class="s" x="30" y="172">Management API :19193</text>
  <text class="s" x="30" y="194">assets, policies,</text>
  <text class="s" x="30" y="212">contract definitions</text>
  <rect class="cp" x="404" y="128" width="220" height="104" rx="8"/>
  <text class="t" x="418" y="152">Control plane</text>
  <text class="s" x="418" y="172">Management API :29193</text>
  <text class="s" x="418" y="194">catalog, negotiations,</text>
  <text class="s" x="418" y="212">transfer processes</text>

  <!-- DSP between control planes -->
  <text class="s" x="320" y="122" text-anchor="middle">Dataspace Protocol</text>
  <text class="n" x="320" y="146" text-anchor="middle">2 catalog request</text>
  <line class="dsp" x1="400" y1="156" x2="242" y2="156" marker-end="url(#d)"/>
  <text class="n" x="320" y="180" text-anchor="middle">3 negotiation</text>
  <line class="dsp" x1="398" y1="190" x2="242" y2="190" marker-start="url(#d)" marker-end="url(#d)"/>
  <text class="n" x="320" y="214" text-anchor="middle">4 transfer process</text>
  <line class="dsp" x1="400" y1="224" x2="242" y2="224" marker-end="url(#d)"/>

  <!-- Signalling -->
  <line class="sig" x1="126" y1="232" x2="126" y2="290" marker-end="url(#a)"/>
  <line class="sig" x1="514" y1="232" x2="514" y2="290" marker-end="url(#a)"/>
  <text class="s" x="136" y="266">signals</text>
  <text class="s" x="504" y="266" text-anchor="end">signals</text>

  <!-- Row C: data planes -->
  <rect class="dp" x="16" y="294" width="220" height="56" rx="8"/>
  <text class="t" x="30" y="318">Data plane</text>
  <text class="s" x="30" y="337">public API :19291</text>
  <rect class="dp" x="404" y="294" width="220" height="56" rx="8"/>
  <text class="t" x="418" y="318">Data plane or destination</text>
  <text class="s" x="418" y="337">receives or pulls the data</text>

  <text class="n" x="320" y="312" text-anchor="middle">5 data</text>
  <line class="line" x1="236" y1="322" x2="398" y2="322" marker-end="url(#a)"/>

  <text class="s" x="16" y="390">Management APIs stay private. Connectors only talk to each other over the</text>
  <text class="s" x="16" y="408">Dataspace Protocol. Ports are those used in the EDC Samples for version 0.14.1.</text>
</svg>
