<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" width="640" height="352" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval-augmented generation with Spring AI and PGVector</title>
  <desc id="desc">Ingest, whenever documents change: documents are read, split into chunks with TokenTextSplitter, turned into vectors by an embedding model and stored in PGVector. Ask, on every question: the question is embedded and the most similar chunks are retrieved from PGVector, added to the prompt alongside the question, and the chat model generates an answer grounded in those chunks. QuestionAnswerAdvisor performs the search and augment steps.</desc>
  <style>
    .bg { fill: #f6f7f9; }
    .h { fill: #161b22; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .t { fill: #161b22; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s { fill: #566070; font: 400 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .m { font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
    .box { fill: #ffffff; stroke: #c3cfda; stroke-width: 1.5; }
    .store { fill: #d5e0e7; stroke: #9fb5c7; stroke-width: 1.5; }
    .line { stroke: #566070; stroke-width: 1.5; fill: none; }
    .acc { stroke: #3d6a8a; stroke-width: 2; fill: none; }
    .brace { stroke: #3d6a8a; stroke-width: 1.5; fill: none; }
    .head { fill: #566070; }
    .head-a, .acc-t { fill: #3d6a8a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #11151b; }
      .h, .t { fill: #e7eaef; }
      .s { fill: #a4adba; }
      .box { fill: #171c23; stroke: #33404c; }
      .store { fill: #283743; stroke: #3d5568; }
      .line { stroke: #a4adba; }
      .acc, .brace { stroke: #9cc1dc; }
      .head { fill: #a4adba; }
      .head-a, .acc-t { fill: #9cc1dc; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-a"/></marker>
  </defs>

  <rect class="bg" width="640" height="352"/>

  <!-- Ingest -->
  <text class="h" x="16" y="30">Ingest <tspan class="s">when documents change</tspan></text>
  <rect class="box" x="16" y="44" width="136" height="60" rx="8"/>
  <text class="t" x="30" y="68">Documents</text>
  <text class="s" x="30" y="88">PDF, Markdown, …</text>
  <line class="line" x1="152" y1="74" x2="172" y2="74" marker-end="url(#a)"/>
  <rect class="box" x="176" y="44" width="136" height="60" rx="8"/>
  <text class="t" x="190" y="68">Split</text>
  <text class="s" x="190" y="88">TokenTextSplitter</text>
  <line class="line" x1="312" y1="74" x2="332" y2="74" marker-end="url(#a)"/>
  <rect class="box" x="336" y="44" width="136" height="60" rx="8"/>
  <text class="t" x="350" y="68">Embed</text>
  <text class="s" x="350" y="88">embedding model</text>
  <line class="line" x1="472" y1="74" x2="484" y2="74" marker-end="url(#a)"/>
  <rect class="store" x="488" y="44" width="136" height="60" rx="8"/>
  <text class="t" x="502" y="68">Store</text>
  <text class="s" x="502" y="88">PGVector</text>

  <!-- Retrieval link -->
  <path class="acc" d="M556 104 V150 H244 V190" marker-end="url(#b)"/>
  <text class="s acc-t" x="400" y="143" text-anchor="middle">similarity search</text>

  <!-- Ask -->
  <text class="h" x="16" y="182">Ask <tspan class="s">on every question</tspan></text>
  <rect class="box" x="16" y="196" width="136" height="60" rx="8"/>
  <text class="t" x="30" y="220">Question</text>
  <text class="s" x="30" y="240">from the user</text>
  <line class="line" x1="152" y1="226" x2="172" y2="226" marker-end="url(#a)"/>
  <rect class="box" x="176" y="196" width="136" height="60" rx="8"/>
  <text class="t" x="190" y="220">Retrieve</text>
  <text class="s" x="190" y="240">top 5 similar chunks</text>
  <line class="line" x1="312" y1="226" x2="332" y2="226" marker-end="url(#a)"/>
  <rect class="box" x="336" y="196" width="136" height="60" rx="8"/>
  <text class="t" x="350" y="220">Augment</text>
  <text class="s" x="350" y="240">question + chunks</text>
  <line class="line" x1="472" y1="226" x2="484" y2="226" marker-end="url(#a)"/>
  <rect class="box" x="488" y="196" width="136" height="60" rx="8"/>
  <text class="t" x="502" y="220">Generate</text>
  <text class="s" x="502" y="240">chat model answers</text>

  <!-- Advisor brace under Retrieve + Augment -->
  <path class="brace" d="M180 268 V276 H468 V268"/>
  <line class="brace" x1="324" y1="276" x2="324" y2="286"/>
  <text class="s acc-t m" x="324" y="304" text-anchor="middle">QuestionAnswerAdvisor</text>
  <text class="s" x="324" y="322" text-anchor="middle">does these two steps for you</text>
</svg>
