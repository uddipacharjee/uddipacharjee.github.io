<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" width="640" height="384" role="img" aria-labelledby="title desc">
  <title id="title">What each kind of Spring Boot test loads</title>
  <desc id="desc">A plain unit test runs a service with a mocked repository. @WebMvcTest loads the web layer with mocked services. @DataJpaTest loads repositories against a real PostgreSQL started by Testcontainers. @SpringBootTest loads the whole application against Testcontainers. Tests near the top are fastest, those near the bottom slowest.</desc>
  <style>
    .bg { fill: #f6f7f9; }
    .t { fill: #161b22; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tm { fill: #161b22; font: 600 13.5px ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
    .s { fill: #566070; font: 400 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .c { font: 500 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .real { fill: #3d6a8a; }
    .real-t { fill: #ffffff; }
    .mock { fill: #ffffff; stroke: #6f8597; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .mock-t { fill: #566070; }
    .none { fill: #e6ebf0; }
    .rule { stroke: #e2e6ec; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #11151b; }
      .t, .tm { fill: #e7eaef; }
      .s, .mock-t { fill: #a4adba; }
      .real { fill: #9cc1dc; }
      .real-t { fill: #11151b; }
      .mock { fill: #171c23; stroke: #6f8597; }
      .none { fill: #1c252e; }
      .rule { stroke: #252b34; }
    }
  </style>

  <rect class="bg" width="640" height="384"/>

  <!-- Column headings -->
  <text class="s" x="260" y="28" text-anchor="middle">Controller</text>
  <text class="s" x="360" y="28" text-anchor="middle">Service</text>
  <text class="s" x="460" y="28" text-anchor="middle">Repository</text>
  <text class="s" x="560" y="28" text-anchor="middle">Database</text>

  <!-- Row 1: unit test -->
  <text class="t" x="16" y="62">Unit test</text>
  <text class="s" x="16" y="81">JUnit + Mockito, milliseconds</text>
  <rect class="none" x="215" y="44" width="90" height="44" rx="6"/>
  <rect class="real" x="315" y="44" width="90" height="44" rx="6"/><text class="c real-t" x="360" y="71" text-anchor="middle">real</text>
  <rect class="mock" x="415" y="44" width="90" height="44" rx="6"/><text class="c mock-t" x="460" y="71" text-anchor="middle">mock</text>
  <rect class="none" x="515" y="44" width="90" height="44" rx="6"/>
  <line class="rule" x1="16" x2="624" y1="104" y2="104"/>

  <!-- Row 2: @WebMvcTest -->
  <text class="tm" x="16" y="138">@WebMvcTest</text>
  <text class="s" x="16" y="157">web slice, a second or two</text>
  <rect class="real" x="215" y="120" width="90" height="44" rx="6"/><text class="c real-t" x="260" y="147" text-anchor="middle">real</text>
  <rect class="mock" x="315" y="120" width="90" height="44" rx="6"/><text class="c mock-t" x="360" y="147" text-anchor="middle">mock</text>
  <rect class="none" x="415" y="120" width="90" height="44" rx="6"/>
  <rect class="none" x="515" y="120" width="90" height="44" rx="6"/>
  <line class="rule" x1="16" x2="624" y1="180" y2="180"/>

  <!-- Row 3: @DataJpaTest -->
  <text class="tm" x="16" y="214">@DataJpaTest</text>
  <text class="s" x="16" y="233">JPA slice + Testcontainers</text>
  <rect class="none" x="215" y="196" width="90" height="44" rx="6"/>
  <rect class="none" x="315" y="196" width="90" height="44" rx="6"/>
  <rect class="real" x="415" y="196" width="90" height="44" rx="6"/><text class="c real-t" x="460" y="223" text-anchor="middle">real</text>
  <rect class="real" x="515" y="196" width="90" height="44" rx="6"/><text class="c real-t" x="560" y="223" text-anchor="middle">PostgreSQL</text>
  <line class="rule" x1="16" x2="624" y1="256" y2="256"/>

  <!-- Row 4: @SpringBootTest -->
  <text class="tm" x="16" y="290">@SpringBootTest</text>
  <text class="s" x="16" y="309">whole app, slowest</text>
  <rect class="real" x="215" y="272" width="90" height="44" rx="6"/><text class="c real-t" x="260" y="299" text-anchor="middle">real</text>
  <rect class="real" x="315" y="272" width="90" height="44" rx="6"/><text class="c real-t" x="360" y="299" text-anchor="middle">real</text>
  <rect class="real" x="415" y="272" width="90" height="44" rx="6"/><text class="c real-t" x="460" y="299" text-anchor="middle">real</text>
  <rect class="real" x="515" y="272" width="90" height="44" rx="6"/><text class="c real-t" x="560" y="299" text-anchor="middle">PostgreSQL</text>

  <!-- Legend -->
  <rect class="real" x="16" y="350" width="14" height="14" rx="3"/>
  <text class="s" x="38" y="361">loaded for real</text>
  <rect class="mock" x="146" y="350" width="14" height="14" rx="3"/>
  <text class="s" x="168" y="361">replaced with a mock</text>
  <rect class="none" x="316" y="350" width="14" height="14" rx="3"/>
  <text class="s" x="338" y="361">not loaded at all</text>
</svg>
