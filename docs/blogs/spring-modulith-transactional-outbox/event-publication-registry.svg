<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Spring Modulith event publication registry as a transactional outbox</title>
  <desc id="desc">In the first transaction, OrderService saves the order and Spring Modulith stores an incomplete event publication in the same commit. After the commit, an application module listener handles the event on another thread in its own transaction. If it succeeds, the publication is marked complete. If it throws or the application stops, the publication stays incomplete and is resubmitted on restart or through IncompleteEventPublications.</desc>
  <style>
    .bg { fill: #f6f7f9; }
    .h { fill: #161b22; font: 600 16px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .t { fill: #161b22; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s { fill: #566070; font: 400 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .m { fill: #161b22; font: 400 12.5px ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
    .region { fill: #e6ebf0; }
    .box { fill: #ffffff; stroke: #c3cfda; stroke-width: 1.5; }
    .good { fill: #d5e0e7; stroke: #9fb5c7; stroke-width: 1.5; }
    .warn { fill: #ffffff; stroke: #b42318; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .line { stroke: #566070; stroke-width: 1.5; fill: none; }
    .ok { stroke: #3d6a8a; stroke-width: 2; fill: none; }
    .bad { stroke: #b42318; stroke-width: 2; fill: none; }
    .head { fill: #566070; }
    .head-ok, .ok-t { fill: #3d6a8a; }
    .head-bad, .bad-t { fill: #b42318; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #11151b; }
      .h, .t, .m { fill: #e7eaef; }
      .s { fill: #a4adba; }
      .region { fill: #1c252e; }
      .box { fill: #171c23; stroke: #33404c; }
      .good { fill: #283743; stroke: #3d5568; }
      .warn { fill: #171c23; stroke: #f97066; }
      .line { stroke: #a4adba; }
      .ok { stroke: #9cc1dc; }
      .bad { stroke: #f97066; }
      .head { fill: #a4adba; }
      .head-ok, .ok-t { fill: #9cc1dc; }
      .head-bad, .bad-t { fill: #f97066; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
    <marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-ok"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-bad"/></marker>
  </defs>

  <rect class="bg" width="640" height="520"/>
  <text class="h" x="16" y="30">The event publication registry as an outbox</text>

  <!-- Transaction 1 -->
  <rect class="region" x="16" y="48" width="608" height="150" rx="12"/>
  <text class="t" x="32" y="74">Transaction 1: OrderService.createOrder()</text>
  <rect class="box" x="32" y="88" width="276" height="92" rx="8"/>
  <text class="s" x="46" y="110">your data</text>
  <text class="m" x="46" y="134">INSERT INTO orders …</text>
  <rect class="box" x="332" y="88" width="276" height="92" rx="8"/>
  <text class="s" x="346" y="110">Spring Modulith, same commit</text>
  <text class="m" x="346" y="134">INSERT INTO event_publication</text>
  <text class="s" x="346" y="158">completion date empty</text>

  <!-- After commit -->
  <line class="line" x1="320" y1="198" x2="320" y2="246" marker-end="url(#a)"/>
  <text class="s" x="330" y="227">after commit, on another thread</text>

  <!-- Transaction 2 -->
  <rect class="region" x="16" y="250" width="608" height="76" rx="12"/>
  <text class="t" x="32" y="276">Transaction 2: InventoryService.on(OrderCreatedEvent)</text>
  <text class="m" x="32" y="302">@ApplicationModuleListener</text>
  <text class="s" x="252" y="302">async, after commit, new transaction</text>

  <!-- Outcomes -->
  <path class="ok" d="M168 326 V372" marker-end="url(#a-ok)"/>
  <text class="s ok-t" x="178" y="354">succeeds</text>
  <rect class="good" x="32" y="376" width="276" height="64" rx="8"/>
  <text class="t" x="46" y="402">Publication completed</text>
  <text class="s" x="46" y="424">completion date set</text>

  <path class="bad" d="M430 326 V372" marker-end="url(#a-bad)"/>
  <text class="s bad-t" x="420" y="354" text-anchor="end">throws, or app stops</text>
  <rect class="warn" x="332" y="376" width="276" height="64" rx="8"/>
  <text class="t" x="346" y="402">Publication stays incomplete</text>
  <text class="s" x="346" y="424">the event is not lost</text>

  <!-- Retry: back into the listener -->
  <path class="line" d="M560 376 V330" marker-end="url(#a)"/>
  <text class="s" x="552" y="354" text-anchor="end">retry</text>

  <text class="s" x="32" y="476">Incomplete publications are resubmitted when the application restarts</text>
  <text class="s" x="32" y="496">(if enabled), or on demand through <tspan class="m">IncompleteEventPublications</tspan>.</text>
</svg>
