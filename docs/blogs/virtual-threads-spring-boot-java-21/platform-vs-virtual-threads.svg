<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 508" width="640" height="508" role="img" aria-labelledby="title desc">
  <title id="title">Platform threads, virtual threads and the connection pool limit</title>
  <desc id="desc">With platform threads, each request holds an operating system thread that spends most of its time blocked on I/O, and Tomcat's default limit is 200 threads. With virtual threads, thousands of threads park cheaply while they wait and mount onto a few carrier threads, one per CPU core, only when they have work to do. A shared resource such as a HikariCP pool of 10 connections still limits how many requests can query the database at once.</desc>
  <style>
    .bg { fill: #f6f7f9; }
    .t { fill: #161b22; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s { fill: #566070; font: 400 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wait { fill: #d5e0e7; }
    .cpu { fill: #3d6a8a; }
    .cpu2 { fill: #6f9cbd; }
    .vt { fill: #9fb5c7; }
    .slot { fill: #3d6a8a; }
    .db { fill: #ffffff; stroke: #c3cfda; stroke-width: 1.5; }
    .rule { stroke: #e2e6ec; stroke-width: 1; }
    .line { stroke: #566070; stroke-width: 1.5; fill: none; }
    .head { fill: #566070; }
    .bad-t { fill: #b42318; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #11151b; }
      .t { fill: #e7eaef; }
      .s { fill: #a4adba; }
      .wait { fill: #283743; }
      .cpu, .slot { fill: #9cc1dc; }
      .cpu2 { fill: #6f9cbd; }
      .vt { fill: #3d5568; }
      .db { fill: #171c23; stroke: #33404c; }
      .rule { stroke: #252b34; }
      .line { stroke: #a4adba; }
      .head { fill: #a4adba; }
      .bad-t { fill: #f97066; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
    <!-- A parked virtual thread every 10px. -->
    <pattern id="vts" width="10" height="10" patternUnits="userSpaceOnUse"><circle class="vt" cx="4" cy="4" r="3"/></pattern>
    <!-- Carrier time slices: short runs of different virtual threads back to back. -->
    <pattern id="slices" width="46" height="14" patternUnits="userSpaceOnUse">
      <rect class="cpu" width="20" height="14" rx="2"/>
      <rect class="cpu2" x="22" width="22" height="14" rx="2"/>
    </pattern>
  </defs>

  <rect class="bg" width="640" height="508"/>

  <!-- 1. Platform threads -->
  <text class="t" x="16" y="28">Platform threads: one OS thread per request</text>
  <text class="s" x="16" y="48">Each thread spends most of its time blocked, waiting for the database or another service</text>
  <g>
    <rect class="wait" x="16" y="62" width="608" height="8" rx="2"/><rect class="cpu" x="16" y="62" width="14" height="8" rx="2"/><rect class="cpu" x="350" y="62" width="10" height="8" rx="2"/>
    <rect class="wait" x="16" y="76" width="608" height="8" rx="2"/><rect class="cpu" x="52" y="76" width="12" height="8" rx="2"/><rect class="cpu" x="420" y="76" width="12" height="8" rx="2"/>
    <rect class="wait" x="16" y="90" width="608" height="8" rx="2"/><rect class="cpu" x="90" y="90" width="10" height="8" rx="2"/><rect class="cpu" x="290" y="90" width="14" height="8" rx="2"/>
    <rect class="wait" x="16" y="104" width="608" height="8" rx="2"/><rect class="cpu" x="30" y="104" width="12" height="8" rx="2"/><rect class="cpu" x="512" y="104" width="10" height="8" rx="2"/>
    <rect class="wait" x="16" y="118" width="608" height="8" rx="2"/><rect class="cpu" x="140" y="118" width="14" height="8" rx="2"/><rect class="cpu" x="460" y="118" width="12" height="8" rx="2"/>
    <rect class="wait" x="16" y="132" width="608" height="8" rx="2"/><rect class="cpu" x="72" y="132" width="10" height="8" rx="2"/><rect class="cpu" x="380" y="132" width="14" height="8" rx="2"/>
  </g>
  <text class="s" x="16" y="162">Tomcat allows 200 threads by default, so request 201 waits for one to free up.</text>

  <!-- 2. Virtual threads -->
  <line class="rule" x1="16" x2="624" y1="182" y2="182"/>
  <text class="t" x="16" y="210">Virtual threads: a blocked thread gives up its carrier</text>
  <text class="s" x="16" y="230">A parked virtual thread costs a little heap memory, not an OS thread</text>
  <g transform="translate(16 246)"><rect width="160" height="90" fill="url(#vts)"/></g>
  <text class="s" x="16" y="356">thousands of virtual threads,</text>
  <text class="s" x="16" y="373">most of them parked on I/O</text>
  <line class="line" x1="186" y1="291" x2="232" y2="291" marker-end="url(#a)"/>
  <text class="s" x="209" y="282" text-anchor="middle">mount</text>
  <g transform="translate(240 248)"><rect width="384" height="14" fill="url(#slices)"/></g>
  <g transform="translate(240 270)"><rect width="384" height="14" fill="url(#slices)"/></g>
  <g transform="translate(240 292)"><rect width="384" height="14" fill="url(#slices)"/></g>
  <g transform="translate(240 314)"><rect width="384" height="14" fill="url(#slices)"/></g>
  <text class="s" x="624" y="356" text-anchor="end">carrier threads, one per CPU core, stay busy</text>

  <!-- 3. The pool -->
  <line class="rule" x1="16" x2="624" y1="392" y2="392"/>
  <text class="t" x="16" y="420">Shared resources still set the limit</text>
  <text class="s" x="16" y="440">HikariCP’s default pool has 10 connections, so the 11th concurrent query waits</text>
  <g transform="translate(16 456)"><rect width="200" height="30" fill="url(#vts)"/></g>
  <line class="line" x1="226" y1="471" x2="268" y2="471" marker-end="url(#a)"/>
  <rect class="slot" x="276" y="460" width="18" height="22" rx="3"/>
  <rect class="slot" x="298" y="460" width="18" height="22" rx="3"/>
  <rect class="slot" x="320" y="460" width="18" height="22" rx="3"/>
  <rect class="slot" x="342" y="460" width="18" height="22" rx="3"/>
  <rect class="slot" x="364" y="460" width="18" height="22" rx="3"/>
  <rect class="slot" x="386" y="460" width="18" height="22" rx="3"/>
  <rect class="slot" x="408" y="460" width="18" height="22" rx="3"/>
  <rect class="slot" x="430" y="460" width="18" height="22" rx="3"/>
  <rect class="slot" x="452" y="460" width="18" height="22" rx="3"/>
  <rect class="slot" x="474" y="460" width="18" height="22" rx="3"/>
  <line class="line" x1="500" y1="471" x2="538" y2="471" marker-end="url(#a)"/>
  <rect class="db" x="546" y="456" width="78" height="30" rx="6"/>
  <text class="s" x="585" y="475" text-anchor="middle">database</text>
</svg>
