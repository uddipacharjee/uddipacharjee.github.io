<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432" role="img" aria-labelledby="title desc">
  <title id="title">Choosing between a Java record and Lombok</title>
  <desc id="desc">If the type is a JPA entity, use a class with Lombok @Getter and @Setter and a protected no-argument constructor, and avoid @Data. Otherwise, if it is immutable data such as a DTO, event, command, configuration or value, use a record, adding Lombok @Builder only if it has many optional fields. Otherwise use a mutable class with Lombok @Getter and @Setter or plain Java. Services can keep using @RequiredArgsConstructor and @Slf4j.</desc>
  <style>
    .bg { fill: #f6f7f9; }
    .t { fill: #161b22; font: 600 14.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tm { fill: #161b22; font: 600 14px ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
    .s { fill: #566070; font: 400 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .q { fill: #e6ebf0; stroke: #9fb5c7; stroke-width: 1.5; }
    .a { fill: #ffffff; stroke: #c3cfda; stroke-width: 1.5; }
    .best { fill: #ffffff; stroke: #3d6a8a; stroke-width: 2; }
    .line { stroke: #566070; stroke-width: 1.5; fill: none; }
    .dash { stroke: #566070; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #566070; }
    .lbl { fill: #3d6a8a; font: 600 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #11151b; }
      .t, .tm { fill: #e7eaef; }
      .s { fill: #a4adba; }
      .q { fill: #1c252e; stroke: #3d5568; }
      .a { fill: #171c23; stroke: #33404c; }
      .best { fill: #171c23; stroke: #9cc1dc; }
      .line, .dash { stroke: #a4adba; }
      .head { fill: #a4adba; }
      .lbl { fill: #9cc1dc; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  </defs>

  <rect class="bg" width="640" height="432"/>

  <!-- Q1 -->
  <rect class="q" x="352" y="20" width="272" height="56" rx="10"/>
  <text class="t" x="368" y="44">Is it a JPA entity?</text>
  <text class="s" x="368" y="63">@Entity or @MappedSuperclass</text>
  <line class="line" x1="352" y1="48" x2="308" y2="48" marker-end="url(#a)"/>
  <text class="lbl" x="330" y="40" text-anchor="middle">yes</text>
  <rect class="a" x="16" y="16" width="288" height="68" rx="8"/>
  <text class="t" x="30" y="40">A class, not a record</text>
  <text class="s" x="30" y="59">@Getter, @Setter, protected no-arg</text>
  <text class="s" x="30" y="75">constructor; skip @Data’s equals/hashCode</text>

  <line class="line" x1="488" y1="76" x2="488" y2="116" marker-end="url(#a)"/>
  <text class="lbl" x="498" y="101">no</text>

  <!-- Q2 -->
  <rect class="q" x="352" y="120" width="272" height="56" rx="10"/>
  <text class="t" x="368" y="144">Is it immutable data?</text>
  <text class="s" x="368" y="163">DTO, event, command, config, value</text>
  <line class="line" x1="352" y1="148" x2="308" y2="148" marker-end="url(#a)"/>
  <text class="lbl" x="330" y="140" text-anchor="middle">yes</text>
  <rect class="best" x="16" y="116" width="288" height="68" rx="8"/>
  <text class="tm" x="30" y="141">record</text>
  <text class="s" x="30" y="160">constructor, accessors, equals, hashCode</text>
  <text class="s" x="30" y="176">and toString with no library at all</text>

  <line class="dash" x1="160" y1="184" x2="160" y2="220" marker-end="url(#a)"/>
  <text class="s" x="170" y="207">optional</text>
  <rect class="a" x="16" y="224" width="288" height="56" rx="8"/>
  <text class="t" x="30" y="248">Many optional fields?</text>
  <text class="s" x="30" y="267">Put Lombok’s @Builder on the record</text>

  <line class="line" x1="488" y1="176" x2="488" y2="306" marker-end="url(#a)"/>
  <text class="lbl" x="498" y="246">no</text>

  <!-- Mutable -->
  <rect class="a" x="352" y="310" width="272" height="56" rx="8"/>
  <text class="t" x="368" y="334">A mutable class</text>
  <text class="s" x="368" y="353">Lombok @Getter/@Setter, or plain Java</text>

  <!-- Note -->
  <text class="s" x="16" y="398">Services and other components: @RequiredArgsConstructor and @Slf4j are unaffected;</text>
  <text class="s" x="16" y="416">records don’t replace them.</text>
</svg>
