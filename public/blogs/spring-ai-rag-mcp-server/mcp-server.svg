<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" width="640" height="196" role="img" aria-labelledby="title desc">
  <title id="title">A Spring Boot MCP server exposing document search as a tool</title>
  <desc id="desc">An AI assistant acting as an MCP client connects to the Spring Boot application's /mcp endpoint over Streamable HTTP. It lists the available tools, then calls search_docs, which the application implements with an @McpTool method that queries the PGVector vector store and returns the matching chunks.</desc>
  <style>
    .bg { fill: #f6f7f9; }
    .t { fill: #161b22; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s { fill: #566070; font: 400 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .m { fill: #161b22; font: 400 12.5px ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
    .box { fill: #ffffff; stroke: #c3cfda; stroke-width: 1.5; }
    .srv { fill: #e6ebf0; stroke: #9fb5c7; stroke-width: 1.5; }
    .store { fill: #d5e0e7; stroke: #9fb5c7; stroke-width: 1.5; }
    .acc { stroke: #3d6a8a; stroke-width: 2; fill: none; }
    .line { stroke: #566070; stroke-width: 1.5; fill: none; }
    .head { fill: #566070; }
    .head-a, .acc-t { fill: #3d6a8a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #11151b; }
      .t, .m { fill: #e7eaef; }
      .s { fill: #a4adba; }
      .box { fill: #171c23; stroke: #33404c; }
      .srv { fill: #1c252e; stroke: #3d5568; }
      .store { fill: #283743; stroke: #3d5568; }
      .acc { stroke: #9cc1dc; }
      .line { stroke: #a4adba; }
      .head { fill: #a4adba; }
      .head-a, .acc-t { fill: #9cc1dc; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-a"/></marker>
  </defs>

  <rect class="bg" width="640" height="196"/>

  <rect class="box" x="16" y="40" width="140" height="88" rx="8"/>
  <text class="t" x="30" y="66">AI assistant</text>
  <text class="s" x="30" y="86">an MCP client:</text>
  <text class="s" x="30" y="104">IDE, chat or agent</text>

  <text class="m acc-t" x="204" y="62" text-anchor="middle">tools/list</text>
  <text class="m acc-t" x="204" y="80" text-anchor="middle">tools/call</text>
  <line class="acc" x1="158" y1="96" x2="250" y2="96" marker-start="url(#b)" marker-end="url(#b)"/>
  <text class="s" x="204" y="120" text-anchor="middle">POST /mcp</text>

  <rect class="srv" x="252" y="24" width="220" height="120" rx="10"/>
  <text class="t" x="266" y="50">Spring Boot MCP server</text>
  <text class="s" x="266" y="70">Streamable HTTP, /mcp</text>
  <rect class="box" x="266" y="84" width="192" height="44" rx="6"/>
  <text class="m" x="278" y="104">@McpTool</text>
  <text class="m" x="278" y="121">search_docs(query)</text>

  <line class="line" x1="472" y1="96" x2="500" y2="96" marker-end="url(#a)"/>
  <rect class="store" x="504" y="64" width="120" height="64" rx="8"/>
  <text class="t" x="518" y="90">PGVector</text>
  <text class="s" x="518" y="110">similarity search</text>

  <text class="s" x="16" y="172">The assistant decides when to call the tool from its name and description; the server only answers.</text>
</svg>
