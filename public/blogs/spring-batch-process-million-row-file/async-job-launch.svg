<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Launching a Spring Batch job asynchronously from a REST endpoint</title>
  <desc id="desc">The client posts to the import endpoint. The controller calls jobLauncher.run, which hands the job to a background thread and returns at once, so the controller answers 202 Accepted with the execution id. The job keeps running on its own thread while the client polls the execution status until it is COMPLETED.</desc>
  <style>
    .bg { fill: #f6f7f9; }
    .t { fill: #161b22; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s { fill: #566070; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .m { fill: #161b22; font: 400 13px ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
    .box { fill: #ffffff; stroke: #c3cfda; stroke-width: 1.5; }
    .life { stroke: #c3cfda; stroke-width: 1.5; stroke-dasharray: 4 5; }
    .bar { fill: #d5e0e7; stroke: #9fb5c7; stroke-width: 1.5; }
    .call { stroke: #566070; stroke-width: 1.5; fill: none; }
    .reply { stroke: #3d6a8a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
    .head { fill: #566070; }
    .head-accent { fill: #3d6a8a; }
    .accent-t { fill: #3d6a8a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #11151b; }
      .t, .m { fill: #e7eaef; }
      .s { fill: #a4adba; }
      .box { fill: #171c23; stroke: #33404c; }
      .life { stroke: #33404c; }
      .bar { fill: #283743; stroke: #3d5568; }
      .call { stroke: #a4adba; }
      .reply { stroke: #9cc1dc; }
      .head { fill: #a4adba; }
      .head-accent, .accent-t { fill: #9cc1dc; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head-accent"/>
    </marker>
  </defs>

  <rect class="bg" width="640" height="380"/>

  <!-- Participants -->
  <rect class="box" x="20" y="16" width="140" height="44" rx="8"/>
  <text class="t" x="90" y="43" text-anchor="middle">Client</text>
  <rect class="box" x="245" y="16" width="150" height="44" rx="8"/>
  <text class="t" x="320" y="43" text-anchor="middle">ImportController</text>
  <rect class="box" x="470" y="16" width="150" height="44" rx="8"/>
  <text class="t" x="545" y="43" text-anchor="middle">Batch thread</text>

  <line class="life" x1="90" y1="60" x2="90" y2="364"/>
  <line class="life" x1="320" y1="60" x2="320" y2="364"/>
  <line class="life" x1="545" y1="60" x2="545" y2="364"/>

  <!-- Job runs on its own thread -->
  <rect class="bar" x="539" y="140" width="12" height="190" rx="3"/>
  <text class="s" x="533" y="226" text-anchor="end">2,000 chunks of 500,</text>
  <text class="s" x="533" y="244" text-anchor="end">one commit each</text>

  <!-- 1. start -->
  <text class="m" x="205" y="96" text-anchor="middle">POST /jobs/import-students</text>
  <line class="call" x1="90" y1="106" x2="314" y2="106" marker-end="url(#arrow)"/>

  <!-- 2. hand off -->
  <text class="m" x="428" y="130" text-anchor="middle">jobLauncher.run(…)</text>
  <line class="call" x1="320" y1="140" x2="533" y2="140" marker-end="url(#arrow)"/>

  <!-- 3. immediate reply -->
  <text class="s accent-t" x="205" y="170" text-anchor="middle">202 Accepted, executionId 42</text>
  <line class="reply" x1="320" y1="180" x2="96" y2="180" marker-end="url(#arrow-accent)"/>

  <!-- 4. poll -->
  <text class="m" x="205" y="236" text-anchor="middle">GET /jobs/executions/42</text>
  <line class="call" x1="90" y1="246" x2="314" y2="246" marker-end="url(#arrow)"/>
  <text class="s accent-t" x="205" y="276" text-anchor="middle">status STARTED</text>
  <line class="reply" x1="320" y1="286" x2="96" y2="286" marker-end="url(#arrow-accent)"/>

  <!-- 5. done -->
  <text class="s" x="533" y="352" text-anchor="end">execution COMPLETED</text>
  <line class="call" x1="545" y1="330" x2="545" y2="340"/>
</svg>
