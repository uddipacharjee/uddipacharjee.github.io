<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" width="640" height="412" role="img" aria-labelledby="title desc">
  <title id="title">From a failed validation to an RFC 9457 problem detail response in Spring Boot</title>
  <desc id="desc">A POST request fails @Valid validation and Spring raises MethodArgumentNotValidException. A @RestControllerAdvice turns it into a ProblemDetail, sent as 400 Bad Request with content type application/problem+json. The JSON body has the standard members type, title, status, detail and instance, plus an errors extension member listing each invalid field and its message.</desc>
  <style>
    .bg { fill: #f6f7f9; }
    .t { fill: #161b22; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s { fill: #566070; font: 400 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tm { fill: #161b22; font: 600 13px ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
    .code { fill: #161b22; font: 400 12px ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
    .std { fill: #3d6a8a; font-weight: 600; }
    .ext { fill: #8a4b00; font-weight: 600; }
    .box { fill: #ffffff; stroke: #c3cfda; stroke-width: 1.5; }
    .fail { fill: #ffffff; stroke: #b42318; stroke-width: 1.5; }
    .panel { fill: #e6ebf0; }
    .line { stroke: #566070; stroke-width: 1.5; fill: none; }
    .head { fill: #566070; }
    .bad-t { fill: #b42318; }
    .sw-std { fill: #3d6a8a; }
    .sw-ext { fill: #8a4b00; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #11151b; }
      .t, .tm, .code { fill: #e7eaef; }
      .s { fill: #a4adba; }
      .std, .sw-std { fill: #9cc1dc; }
      .ext, .sw-ext { fill: #f0b46c; }
      .box { fill: #171c23; stroke: #33404c; }
      .fail { fill: #171c23; stroke: #f97066; }
      .panel { fill: #1c252e; }
      .line { stroke: #a4adba; }
      .head { fill: #a4adba; }
      .bad-t { fill: #f97066; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  </defs>

  <rect class="bg" width="640" height="412"/>

  <!-- Flow -->
  <rect class="box" x="16" y="16" width="228" height="56" rx="8"/>
  <text class="tm" x="30" y="40">POST /api/orders</text>
  <text class="s" x="30" y="60">JSON body with two bad fields</text>
  <line class="line" x1="130" y1="72" x2="130" y2="96" marker-end="url(#a)"/>

  <rect class="fail" x="16" y="100" width="228" height="56" rx="8"/>
  <text class="tm" x="30" y="124">@Valid @RequestBody</text>
  <text class="s bad-t" x="30" y="144">MethodArgumentNotValidException</text>
  <line class="line" x1="130" y1="156" x2="130" y2="180" marker-end="url(#a)"/>

  <rect class="box" x="16" y="184" width="228" height="56" rx="8"/>
  <text class="tm" x="30" y="208">@RestControllerAdvice</text>
  <text class="s" x="30" y="228">fills in a ProblemDetail</text>
  <line class="line" x1="130" y1="240" x2="130" y2="264" marker-end="url(#a)"/>

  <rect class="box" x="16" y="268" width="228" height="56" rx="8"/>
  <text class="t" x="30" y="292">400 Bad Request</text>
  <text class="s" x="30" y="312">application/problem+json</text>
  <line class="line" x1="244" y1="296" x2="262" y2="296" marker-end="url(#a)"/>

  <!-- Response body -->
  <rect class="panel" x="270" y="16" width="354" height="292" rx="10"/>
  <text class="code" x="286" y="44">{</text>
  <text class="code" x="300" y="64"><tspan class="std">"type"</tspan>: "https://shop.dev/problems/invalid",</text>
  <text class="code" x="300" y="84"><tspan class="std">"title"</tspan>: "Invalid request",</text>
  <text class="code" x="300" y="104"><tspan class="std">"status"</tspan>: 400,</text>
  <text class="code" x="300" y="124"><tspan class="std">"detail"</tspan>: "2 fields are invalid",</text>
  <text class="code" x="300" y="144"><tspan class="std">"instance"</tspan>: "/api/orders",</text>
  <text class="code" x="300" y="164"><tspan class="ext">"errors"</tspan>: [</text>
  <text class="code" x="314" y="184">{ "field": "item.quantity",</text>
  <text class="code" x="328" y="204">"message": "must be at least 1" },</text>
  <text class="code" x="314" y="224">{ "field": "customer.email",</text>
  <text class="code" x="328" y="244">"message": "must be a valid email" }</text>
  <text class="code" x="300" y="264">]</text>
  <text class="code" x="286" y="284">}</text>

  <!-- Legend -->
  <rect class="sw-std" x="16" y="364" width="12" height="12" rx="2"/>
  <text class="s" x="36" y="374">Standard members defined by RFC 9457</text>
  <rect class="sw-ext" x="16" y="388" width="12" height="12" rx="2"/>
  <text class="s" x="36" y="398">Extension member: anything else your clients need</text>
</svg>
