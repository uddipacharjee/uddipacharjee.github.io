<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 398" width="640" height="398" role="img" aria-labelledby="title desc">
  <title id="title">How long each JDK distribution gives Java 25 free updates</title>
  <desc id="desc">Published end of free updates for Java 25, which was released in September 2025: Amazon Corretto, Oct 2032; Eclipse Temurin, at least Sep 2031; IBM Semeru, Sep 2031; Microsoft, at least Sep 2030; SapMachine, Sep 2030; Oracle JDK (NFTC), Sep 2028; Oracle OpenJDK, Jan 2026. Azul Zulu and BellSoft Liberica publish no separate end date for their free builds, and Red Hat ties updates to its subscriptions.</desc>
  <style>
    .bg { fill: #f6f7f9; }
    .h { fill: #161b22; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .t { fill: #161b22; font: 500 13.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s { fill: #566070; font: 400 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .in { fill: #ffffff; }
    .lbl { paint-order: stroke; stroke: #f6f7f9; stroke-width: 5px; stroke-linejoin: round; }
    .bar { fill: #3d6a8a; }
    .ended { fill: #b9c2cc; }
    .grid { stroke: #e2e6ec; stroke-width: 1; }
    .today { stroke: #b42318; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .today-t { fill: #b42318; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #11151b; }
      .h, .t { fill: #e7eaef; }
      .s { fill: #a4adba; }
      .in { fill: #11151b; }
      .lbl { stroke: #11151b; }
      .bar { fill: #9cc1dc; }
      .ended { fill: #3a4450; }
      .grid { stroke: #252b34; }
      .today { stroke: #f97066; }
      .today-t { fill: #f97066; }
    }
  </style>

  <rect class="bg" width="640" height="398"/>
  <text class="h" x="16" y="28">Java 25: free updates from September 2025 until…</text>

  <line class="grid" x1="172" x2="172" y1="50" y2="302"/><text class="s" x="172" y="320" text-anchor="middle">2025</text>
  <line class="grid" x1="222.22222222222223" x2="222.22222222222223" y1="50" y2="302"/><text class="s" x="222.22222222222223" y="320" text-anchor="middle">2026</text>
  <line class="grid" x1="272.44444444444446" x2="272.44444444444446" y1="50" y2="302"/><text class="s" x="272.44444444444446" y="320" text-anchor="middle">2027</text>
  <line class="grid" x1="322.66666666666663" x2="322.66666666666663" y1="50" y2="302"/><text class="s" x="322.66666666666663" y="320" text-anchor="middle">2028</text>
  <line class="grid" x1="372.8888888888889" x2="372.8888888888889" y1="50" y2="302"/><text class="s" x="372.8888888888889" y="320" text-anchor="middle">2029</text>
  <line class="grid" x1="423.1111111111111" x2="423.1111111111111" y1="50" y2="302"/><text class="s" x="423.1111111111111" y="320" text-anchor="middle">2030</text>
  <line class="grid" x1="473.3333333333333" x2="473.3333333333333" y1="50" y2="302"/><text class="s" x="473.3333333333333" y="320" text-anchor="middle">2031</text>
  <line class="grid" x1="523.5555555555555" x2="523.5555555555555" y1="50" y2="302"/><text class="s" x="523.5555555555555" y="320" text-anchor="middle">2032</text>
  <line class="grid" x1="573.7777777777778" x2="573.7777777777778" y1="50" y2="302"/><text class="s" x="573.7777777777778" y="320" text-anchor="middle">2033</text>
  <line class="today" x1="259.9" x2="259.9" y1="46" y2="302"/>
  <text class="s today-t" x="263.9" y="44">today (Oct 2026)</text>

  <text class="t" x="16" y="78">Amazon Corretto</text>
  <rect class="bar" x="205.5" y="65" width="355.7" height="16" rx="3"/>
  <text class="s lbl" x="569.2" y="77">Oct 2032</text>
  <text class="t" x="16" y="112">Eclipse Temurin</text>
  <rect class="bar" x="205.5" y="99" width="301.3" height="16" rx="3"/>
  <text class="s lbl" x="514.8" y="111">at least Sep 2031</text>
  <text class="t" x="16" y="146">IBM Semeru</text>
  <rect class="bar" x="205.5" y="133" width="301.3" height="16" rx="3"/>
  <text class="s lbl" x="514.8" y="145">Sep 2031</text>
  <text class="t" x="16" y="180">Microsoft</text>
  <rect class="bar" x="205.5" y="167" width="251.1" height="16" rx="3"/>
  <text class="s lbl" x="464.6" y="179">at least Sep 2030</text>
  <text class="t" x="16" y="214">SapMachine</text>
  <rect class="bar" x="205.5" y="201" width="251.1" height="16" rx="3"/>
  <text class="s lbl" x="464.6" y="213">Sep 2030</text>
  <text class="t" x="16" y="248">Oracle JDK (NFTC)</text>
  <rect class="bar" x="205.5" y="235" width="150.7" height="16" rx="3"/>
  <text class="s lbl" x="364.1" y="247">Sep 2028</text>
  <text class="t" x="16" y="282">Oracle OpenJDK</text>
  <rect class="ended" x="205.5" y="269" width="16.7" height="16" rx="3"/>
  <text class="s lbl" x="230.2" y="281">Jan 2026</text>


  <text class="s" x="16" y="350">Dates are each vendor’s published end of free updates. Azul Zulu and BellSoft Liberica</text>
  <text class="s" x="16" y="368">publish no separate end date for their free builds; Red Hat ties updates to subscriptions.</text>
</svg>
